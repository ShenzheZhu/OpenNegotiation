name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  no-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: PYTHONPATH=src python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

      - name: Run no-key benchmark smoke
        run: opennego run --config configs/no_key_smoke.yaml --output-dir /tmp/opennego-ci-smoke

  web-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and build web client
        working-directory: web
        run: npm run build
