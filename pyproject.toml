[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opennego"
version = "0.1.0"
description = "Evaluation gym for agent-level agent-to-agent negotiation and transaction research."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Kordi AI" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
llm = [
  "litellm>=1.0"
]

[project.scripts]
opennego = "opennego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
